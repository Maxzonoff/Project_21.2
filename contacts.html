<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Контакты - Интернет-магазин</title>
    <link href="style.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="main-container">
    <div class="sidebar">
        <div class="nav-logo">
            <img src="img/img_logo.png" alt="Логотип" style="height: 40px;">
            <span class="logo-text">Меню</span>
        </div>

        <div class="nav-divider"></div>

        <a href="/" class="nav-item">Главная</a>
        <a href="/catalog.html" class="nav-item">Каталог</a>
        <a href="/category.html" class="nav-item">Категория</a>
        <a href="/contacts.html" class="nav-item active">Контакты</a>

        <div style="flex-grow: 1;"></div>

        <div class="nav-divider"></div>
        <div class="sidebar-footer">Пользователи</div>
    </div>

    <div class="content-container">
        <div class="two-column-layout">
            <!-- Левая колонка с формой -->
            <div class="left-column">
                <div class="form-container">
                    <h3 class="form-title">Напишите нам</h3>
                    <div class="mb-4">
                        <label class="form-label">Имя</label>
                        <input type="text" class="form-control" placeholder="Введите ваше имя">
                    </div>
                    <div class="mb-4">
                        <label class="form-label">Почта</label>
                        <input type="email" class="form-control" placeholder="Введите ваш email">
                    </div>
                    <div class="mb-4">
                        <label class="form-label">Сообщение</label>
                        <textarea class="form-control" rows="5" placeholder="Введите ваше сообщение"></textarea>
                        <button type="button" class="btn btn-primary mt-3 w-100">Отправить</button>
                    </div>
                </div>
            </div>

            <!-- Правая колонка с текстом -->
            <div class="right-column">
                <div class="text-container">
                    <h1 class="contacts-title">Контакты</h1>

                    <div class="contacts-text">
                        <h2>Наши контакты</h2>
                        <p>
                            Если у вас возникли вопросы - звоните!
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
